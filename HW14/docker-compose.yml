version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: dockerfile
    container_name: students-api
    expose:
      - "8000"
    networks:
      - students-network
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - students-network
    restart: unless-stopped

networks:
  students-network:
    driver: bridge